apiVersion: apps/v1
kind: Deployment
metadata:
  name: p002
  namespace: frauth-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: frauthctf, workspace: p002}
  template:
    metadata:
      labels: {app: frauthctf, workspace: p002}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: frauthctf:lab1
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env: [{name: WORKSPACE_ID, value: p002}]
          volumeMounts: [{name: state, mountPath: /state}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
      volumes:
        - name: state
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: p002
  namespace: frauth-lab
spec:
  type: ClusterIP
  selector: {app: frauthctf, workspace: p002}
  ports: [{name: http, port: 80, targetPort: http}]
